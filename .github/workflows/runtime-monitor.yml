name: Socratink runtime monitor

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      preview_deployment:
        description: 'Optional isolated preview deployment ID for an alert drill'
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: socratink-runtime-monitor-${{ github.ref }}-${{ inputs.preview_deployment && 'verification' || 'production' }}
  cancel-in-progress: false

jobs:
  monitor:
    name: ${{ inputs.preview_deployment && 'Preview monitor' || 'Production monitor' }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.preview_deployment && 'runtime-monitor-verification' || 'runtime-monitor' }}
    steps:
      - name: Check out reviewed monitor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check public app availability
        if: github.ref == 'refs/heads/main' && inputs.preview_deployment == ''
        run: |
          node --input-type=module <<'NODE'
          try {
            const response = await fetch('https://app.socratink.ai/healthz', { redirect: 'manual', signal: AbortSignal.timeout(15_000) });
            if (response.status !== 200 || (await response.json()).status !== 'ok') throw new Error();
          } catch {
            console.error('Socratink public health check failed.');
            process.exitCode = 1;
          }
          NODE

      - name: Check runtime failures
        if: always() && !cancelled()
        run: node scripts/runtime-monitor.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          MONITOR_PREVIEW_DEPLOYMENT: ${{ inputs.preview_deployment || '' }}

      - name: Check monitor cadence
        if: always() && !cancelled() && inputs.preview_deployment == ''
        run: node scripts/monitor-cadence.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
