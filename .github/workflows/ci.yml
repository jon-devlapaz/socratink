name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full quality gate
        shell: bash
        run: |
          mkdir -p .cache/browser-proof
          pnpm check 2>&1 | tee .cache/browser-proof/check.log

      - name: Run deterministic browser smoke test
        shell: bash
        run: pnpm smoke 2>&1 | tee .cache/browser-proof/smoke.log
        env:
          REVEAL_BROWSER: '1'
          BROWSER_PROOF_DIR: .cache/browser-proof

      - name: Run provider request-path smoke test
        shell: bash
        run: pnpm smoke:request-path 2>&1 | tee .cache/browser-proof/request-path.log
        env:
          REQUEST_PATH_SMOKE_OUT: .cache/browser-proof/request-path

      - name: Verify Pi execution and browser recovery
        run: pnpm smoke:durable
        env:
          DURABLE_SMOKE_OUT: .cache/browser-proof/durable

      - name: Prepare disposable PostgreSQL
        run: docker pull postgres:17-alpine

      - name: Verify PostgreSQL ownership and existing account continuity
        # Reuses dist/ from `pnpm check`; `pnpm smoke:durable:postgres` would build again.
        run: pnpm test:durable:postgres && node scripts/durable-postgres-smoke.mjs
        env:
          DURABLE_POSTGRES_SMOKE_OUT: .cache/browser-proof/durable-postgres

      - name: Upload synthetic browser proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-proof-node22-linux
          path: .cache/browser-proof
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
