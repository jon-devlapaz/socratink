name: Sync Agentic Engineering Wiki docs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python scripts/sync_agenteng_docs.py --output . --workers 2
      - run: git diff --check -- Docs _meta Home.md
      - name: Commit updated documentation snapshot
        id: commit
        run: |
          if git diff --quiet -- Docs _meta Home.md; then
            echo "No documentation changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "agenteng-docs-bot"
          git config user.email "agenteng-docs-bot@users.noreply.github.com"
          git add -- Docs _meta Home.md
          git commit -m "chore(docs): sync Agentic Engineering Wiki documentation"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open notification issue
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          shortstat=$(git show --shortstat --format= "$sha" | tail -n 1 | sed 's/^[[:space:]]*//')
          gh issue create \
            --title "Agentic Engineering Wiki docs updated ($(date -u +%F))" \
            --assignee "$GITHUB_REPOSITORY_OWNER" \
            --body "$(printf '%s\n' \
              "The Agentic Engineering Wiki docs sync wrote new files." \
              "" \
              "- ${shortstat}" \
              "- Commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${sha}" \
              "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              "" \
              "Assigned automatically so you get a GitHub notification. Close after reviewing." \
            )"
