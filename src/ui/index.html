<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" id="theme-color" content="#fffcf0" />
		<title>Socratink</title>
		<link
			rel="icon"
			type="image/svg+xml"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23050505'/%3E%3C/svg%3E"
		/>
		<script>
			(function () {
				var key = '%SOCRATINK_THEME_STORAGE_KEY%';
				var stored = null;
				try { stored = localStorage.getItem(key); } catch {}
				var dark =
					stored === 'dark' ||
					(stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				if (stored === 'light' || stored === 'dark') {
					document.documentElement.dataset.theme = stored;
				}
				var meta = document.getElementById('theme-color');
				if (meta) meta.setAttribute('content', dark ? '#100f0f' : '#fffcf0');
				var typeSize = null;
				try { typeSize = localStorage.getItem('%SOCRATINK_TYPE_SIZE_STORAGE_KEY%'); } catch {}
				if (typeSize === 'big' || typeSize === 'medium' || typeSize === 'small') {
					document.documentElement.dataset.typeSize = typeSize;
				}
			})();
		</script>
	</head>
	<body class="conversation-empty">
		<div id="root"><!--page--></div>
		<script type="module" src="/main.tsx"></script>
	</body>
</html>
