<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" id="theme-color" content="#fffcf0" />
		<title>Socratink</title>
		<!-- git-auto-prod-probe -->
		<link
			rel="icon"
			type="image/svg+xml"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23050505'/%3E%3C/svg%3E"
		/>
		<script>
			(function () {
				var key = 'socratink-theme';
				var stored = localStorage.getItem(key);
				var dark =
					stored === 'dark' ||
					(stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				if (stored === 'light' || stored === 'dark') {
					document.documentElement.dataset.theme = stored;
				}
				var meta = document.getElementById('theme-color');
				if (meta) meta.setAttribute('content', dark ? '#100f0f' : '#fffcf0');
			})();
		</script>
	</head>
	<body>
		<button
			class="peek-handle"
			id="peek-handle"
			type="button"
			aria-expanded="false"
			aria-haspopup="dialog"
			aria-controls="menu-dialog"
			aria-label="Open menu"
		>
			<span class="sr-only">Open menu</span>
		</button>

		<div class="app-canvas">
			<button
				class="brand-lockup"
				id="menu-trigger"
				type="button"
				aria-expanded="false"
				aria-haspopup="dialog"
				aria-controls="menu-dialog"
			>
				<span class="brand-mark" aria-hidden="true"></span>
				<span class="brand-name-viewport" aria-hidden="true">
					<img class="brand-name" src="./brand-wordmark.png" alt="" />
				</span>
				<span class="sr-only">Open menu</span>
			</button>

			<main class="stage">
				<div class="alive-core"></div>

				<section class="active-node" aria-label="Current step">
					<div class="active-scroll">
						<button class="trail-toggle" id="trail-toggle" type="button" hidden aria-expanded="false">
							<span id="trail-toggle-label">Earlier steps</span>
							<span class="trail-caret" aria-hidden="true">
								<svg viewBox="0 0 16 16" fill="none">
									<path
										d="M3.5 6.25 8 10.75l4.5-4.5"
										stroke="currentColor"
										stroke-width="1.5"
										stroke-linecap="round"
										stroke-linejoin="round"
									/>
								</svg>
							</span>
						</button>
						<ol id="messages" hidden></ol>
						<div id="active-turn"></div>
						<div class="turn-spacer" id="turn-spacer" aria-hidden="true"></div>
					</div>
					<button class="jump-latest" id="jump-latest" type="button" hidden aria-label="Jump to latest">
						<svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
							<path
								d="M3.5 6.25 8 10.75l4.5-4.5"
								stroke="currentColor"
								stroke-width="1.5"
								stroke-linecap="round"
								stroke-linejoin="round"
							/>
						</svg>
						Latest
					</button>
				</section>
			</main>

			<footer class="dock">
				<form id="chat">
					<label class="sr-only" for="message">Message Socratink</label>
					<textarea
						id="message"
						name="message"
						placeholder="Message Socratink…"
						rows="2"
						required
					></textarea>
					<div class="composer-footer">
						<span>⌘ / Ctrl + Enter</span>
						<button aria-label="Send message" type="submit">
							<span aria-hidden="true">↑</span>
						</button>
					</div>
				</form>
			</footer>
		</div>

		<div class="menu-layer" id="menu-layer" aria-hidden="true">
			<button
				class="menu-backdrop"
				id="menu-backdrop"
				type="button"
				tabindex="-1"
				aria-label="Close menu"
			></button>
			<div
				class="menu-panel"
				id="menu-dialog"
				role="dialog"
				aria-modal="true"
				aria-label="Menu"
			>
				<nav class="menu-orbs">
					<a href="/">
						<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
							<path
								d="M4.75 11.25 12 4.75l7.25 6.5"
								stroke="currentColor"
								stroke-width="1.5"
								stroke-linecap="round"
								stroke-linejoin="round"
							/>
							<path
								d="M6.75 10.75V19h10.5v-8.25"
								stroke="currentColor"
								stroke-width="1.5"
								stroke-linejoin="round"
							/>
						</svg>
						<span>Home</span>
					</a>
					<button
						id="appearance-toggle"
						type="button"
						aria-pressed="false"
						aria-label="Switch to dark appearance"
					>
						<span class="orb-glyph" aria-hidden="true">
							<span class="theme-icon is-sun">
								<svg viewBox="0 0 24 24" fill="none">
									<circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.5" />
									<path
										d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"
										stroke="currentColor"
										stroke-width="1.5"
										stroke-linecap="round"
									/>
								</svg>
							</span>
							<span class="theme-icon is-moon">
								<svg viewBox="0 0 24 24" fill="none">
									<path
										d="M15.4 13.6A6.4 6.4 0 0 1 10.2 5.4 6.9 6.9 0 1 0 18.6 14a6.4 6.4 0 0 1-3.2-.4z"
										stroke="currentColor"
										stroke-width="1.5"
										stroke-linejoin="round"
									/>
								</svg>
							</span>
						</span>
						<span>Appearance</span>
					</button>
					<button id="start-over" type="button">
						<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
							<path
								d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"
								stroke="currentColor"
								stroke-width="1.5"
								stroke-linecap="round"
							/>
							<path
								d="M4.5 5.5v4h4"
								stroke="currentColor"
								stroke-width="1.5"
								stroke-linecap="round"
								stroke-linejoin="round"
							/>
						</svg>
						<span>Start over</span>
					</button>
				</nav>
				<div class="menu-handle" id="menu-handle" aria-hidden="true"></div>
			</div>
		</div>

		<script type="module" src="/main.ts"></script>
	</body>
</html>
