<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#f3efe6" />
		<title>Socratink</title>
		<link
			rel="icon"
			type="image/svg+xml"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23050505'/%3E%3C/svg%3E"
		/>
	</head>
	<body>
		<a class="brand-lockup" href="/" aria-label="Socratink home">
			<span class="brand-mark" aria-hidden="true"></span>
			<span class="brand-name-viewport" aria-hidden="true">
				<span class="brand-name">Socratink</span>
			</span>
		</a>

		<main class="chat-surface">
      <div class="alive-core"></div>

			<section class="thought-card" aria-label="Socratink chat">
				<ol id="messages" aria-live="polite"></ol>
				<form id="chat">
					<label class="sr-only" for="message">Message Socratink</label>
					<textarea
						id="message"
						name="message"
						placeholder="Message Socratink…"
						rows="3"
						required
					></textarea>
					<div class="composer-footer">
						<span>⌘ / Ctrl + Enter</span>
						<button aria-label="Send message" type="submit">↑</button>
					</div>
				</form>
			</section>
		</main>

		<script type="module" src="/main.ts"></script>
	</body>
</html>
