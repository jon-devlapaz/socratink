<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" id="theme-color" content="#fffcf0" />
		<title>Socratink</title>
		<!-- git-auto-prod-probe -->
		<link
			rel="icon"
			type="image/svg+xml"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23050505'/%3E%3C/svg%3E"
		/>
		<script>
			(function () {
				var key = 'socratink-theme';
				var stored = localStorage.getItem(key);
				var dark =
					stored === 'dark' ||
					(stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				if (stored === 'light' || stored === 'dark') {
					document.documentElement.dataset.theme = stored;
				}
				var meta = document.getElementById('theme-color');
				if (meta) meta.setAttribute('content', dark ? '#100f0f' : '#fffcf0');
				var typeSize = localStorage.getItem('socratink-type-size');
				if (typeSize === 'big' || typeSize === 'medium' || typeSize === 'small') {
					document.documentElement.dataset.typeSize = typeSize;
				}
			})();
		</script>
	</head>
	<body>
		<button
			class="peek-handle"
			id="peek-handle"
			type="button"
			aria-expanded="false"
			aria-haspopup="dialog"
			aria-controls="menu-dialog"
			aria-label="Open menu"
		>
			<span class="sr-only">Open menu</span>
		</button>

		<div class="app-canvas">
			<button
				class="brand-lockup"
				id="menu-trigger"
				type="button"
				aria-expanded="false"
				aria-haspopup="dialog"
				aria-controls="menu-dialog"
			>
				<span class="brand-mark" aria-hidden="true"></span>
				<span class="brand-name-viewport" aria-hidden="true">
					<img class="brand-name" src="./brand-wordmark.png" alt="" />
				</span>
				<span class="sr-only">Open menu</span>
			</button>

			<main class="stage">
				<div class="alive-cluster">
					<div class="alive-anchor">
						<button
							class="alive-core"
							id="dock-trigger"
							type="button"
							aria-expanded="false"
							aria-controls="app-dock"
							aria-label="Open learning tools"
						></button>
						<nav class="app-dock" id="app-dock" aria-label="Learning tools" aria-hidden="true" inert>
						<button type="button" class="app-dock-item" aria-label="Goal. Not available yet.">
							<svg class="app-dock-glyph" viewBox="0 0 24 24" fill="none" aria-hidden="true">
								<circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
								<circle cx="12" cy="12" r="6" stroke="currentColor" stroke-width="2" />
								<circle cx="12" cy="12" r="2" stroke="currentColor" stroke-width="2" />
							</svg>
							<span class="app-dock-tip">Goal</span>
						</button>
						<button type="button" class="app-dock-item" aria-label="Practice. Not available yet.">
							<svg class="app-dock-glyph" viewBox="0 0 24 24" fill="none" aria-hidden="true">
								<path
									d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"
									stroke="currentColor"
									stroke-width="2"
									stroke-linecap="round"
									stroke-linejoin="round"
								/>
								<path d="m15 5 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
							</svg>
							<span class="app-dock-tip">Practice</span>
						</button>
						<span class="app-dock-rule" role="separator"></span>
						<button type="button" class="app-dock-item" aria-label="Explain. Not available yet.">
							<svg class="app-dock-glyph" viewBox="0 0 24 24" fill="none" aria-hidden="true">
								<path
									d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"
									stroke="currentColor"
									stroke-width="2"
									stroke-linecap="round"
									stroke-linejoin="round"
								/>
							</svg>
							<span class="app-dock-tip">Explain</span>
						</button>
						<button type="button" class="app-dock-item" aria-label="Check. Not available yet.">
							<svg class="app-dock-glyph" viewBox="0 0 24 24" fill="none" aria-hidden="true">
								<circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
								<path
									d="M12 6v6l4 2"
									stroke="currentColor"
									stroke-width="2"
									stroke-linecap="round"
									stroke-linejoin="round"
								/>
							</svg>
							<span class="app-dock-tip">Check</span>
						</button>
					</nav>
					</div>
				</div>

				<section class="active-node" aria-label="Current step">
					<div class="active-scroll">
						<button class="trail-toggle" id="trail-toggle" type="button" hidden aria-expanded="false">
							<span id="trail-toggle-label">Earlier steps</span>
							<span class="trail-caret" aria-hidden="true">
								<svg viewBox="0 0 16 16" fill="none">
									<path
										d="M3.5 6.25 8 10.75l4.5-4.5"
										stroke="currentColor"
										stroke-width="1.5"
										stroke-linecap="round"
										stroke-linejoin="round"
									/>
								</svg>
							</span>
						</button>
						<ol id="messages" hidden aria-label="Earlier steps"></ol>
						<div id="active-turn"></div>
						<template id="starter-template">
							<div class="starter-state">
								<h2 class="starter-heading">Explore agentic engineering</h2>
								<p class="starter-subtext">Choose a starting lens or ask about an agent system below:</p>
								<div class="starter-sparks">
									<button type="button" class="starter-spark-pill" data-prompt="Help me build an intuitive model of an agent loop. Start by asking what part—model, tools, state, memory, or control flow—I find unclear.">
										<span class="starter-spark-glyph" aria-hidden="true">✦</span>
										<div>
											<strong>Understand a mechanism</strong>
											<div class="starter-spark-text">Trace state, tools, memory, and control flow.</div>
										</div>
									</button>
									<button type="button" class="starter-spark-pill" data-prompt="I want to explain an agent-system design. Start by asking me one open-ended question: describe one concrete request from start to finish and identify who owns its state. Do not offer starting modes or choices. After my explanation, challenge its assumptions about tool boundaries, retries, recovery, observability, latency, cost, and safety.">
										<span class="starter-spark-glyph" aria-hidden="true">✦</span>
										<div>
											<strong>Stress-test a design</strong>
											<div class="starter-spark-text">Probe failure modes and tradeoffs.</div>
										</div>
									</button>
									<button type="button" class="starter-spark-pill" data-prompt="Give me one multiple-choice diagnostic about safe recovery when an agent response stream disconnects after request admission may have occurred. Present exactly four recovery actions with one freeform reasoning field. Do not ask me to choose a topic first and do not reveal the best answer until I submit. Then begin your entire feedback response with Socratink-provided, avoid all correctness or praise language, and ask me to revise or apply the reasoning.">
										<span class="starter-spark-glyph" aria-hidden="true">✦</span>
										<div>
											<strong>Diagnostic practice</strong>
											<div class="starter-spark-text">Reason through one bounded system question.</div>
										</div>
									</button>
								</div>
							</div>
						</template>
						<div class="turn-spacer" id="turn-spacer" aria-hidden="true"></div>
					</div>
					<button class="jump-latest" id="jump-latest" type="button" hidden aria-label="Jump to latest">
						<svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
							<path
								d="M3.5 6.25 8 10.75l4.5-4.5"
								stroke="currentColor"
								stroke-width="1.5"
								stroke-linecap="round"
								stroke-linejoin="round"
							/>
						</svg>
						Latest
					</button>
				</section>
			</main>

			<footer class="dock">
				<form id="chat">
					<label class="sr-only" for="message">Message Socratink</label>
					<textarea
						id="message"
						name="message"
						placeholder="Message Socratink…"
						rows="2"
						required
					></textarea>
					<div class="composer-footer">
						<div class="composer-model">
							<div class="auto-model-picker">
								<button
									id="auto-model"
									class="auto-model-trigger"
									type="button"
									value="auto"
									aria-haspopup="listbox"
									aria-expanded="false"
									aria-controls="auto-model-menu"
									aria-label="Routing"
								>
									<span class="auto-model-icons" aria-hidden="true"></span>
									<span class="auto-model-name">Default</span>
									<svg class="auto-model-chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
										<path
											d="M6 9l6 6 6-6"
											stroke="currentColor"
											stroke-width="1.5"
											stroke-linecap="round"
											stroke-linejoin="round"
										/>
									</svg>
								</button>
								<div
									id="auto-model-menu"
									class="auto-model-menu"
									role="listbox"
									aria-label="Routing"
									data-open="false"
									inert
								></div>
							</div>
							<p id="model-route" class="model-route" hidden></p>
						</div>
						<div id="dictation-status" class="dictation-status" role="status" aria-live="polite" data-state="idle">
							<span class="dictation-voice" aria-hidden="true">
								<span class="dictation-pulse"></span>
								<span class="dictation-bars">
									<span></span><span></span><span></span><span></span><span></span><span></span><span></span>
									<span></span><span></span><span></span><span></span><span></span><span></span><span></span>
								</span>
								<span class="dictation-timer">0:00</span>
								<span class="dictation-settling">Transcribing</span>
							</span>
							<span class="dictation-error" aria-hidden="true" hidden></span>
							<span class="dictation-announcement sr-only"></span>
						</div>
						<div class="composer-send">
							<span class="composer-hint">⌘ / Ctrl + Enter</span>
							<button
								id="dictation-toggle"
								class="dictation-toggle"
								type="button"
								hidden
								disabled
								aria-pressed="false"
								aria-label="Start dictation"
								aria-describedby="dictation-privacy"
								title="Dictate — say “Send message” to send"
							>
								<span class="dictation-icon is-mic" aria-hidden="true">
									<svg viewBox="0 0 24 24" fill="none">
										<rect x="9" y="3" width="6" height="11" rx="3" stroke="currentColor" stroke-width="1.5" />
										<path d="M6.5 11.5a5.5 5.5 0 0 0 11 0M12 17v4M9 21h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
									</svg>
								</span>
								<span class="dictation-icon is-stop" aria-hidden="true">
									<svg viewBox="0 0 24 24" fill="currentColor"><rect x="8" y="8" width="8" height="8" rx="1" /></svg>
								</span>
							</button>
							<button aria-label="Send message" type="submit">
								<span aria-hidden="true">↑</span>
							</button>
						</div>
					</div>
					<p id="dictation-privacy" class="sr-only">Speech recognition is provided by your browser and may use an online service. Socratink uses microphone volume on this device to animate the orb; audio is not uploaded or stored by Socratink. Say “Send message” at the end to send the recognized text.</p>
				</form>
			</footer>
		</div>

		<div class="menu-layer" id="menu-layer" aria-hidden="true">
			<button
				class="menu-backdrop"
				id="menu-backdrop"
				type="button"
				tabindex="-1"
				aria-label="Close menu"
			></button>
			<div
				class="menu-panel"
				id="menu-dialog"
				role="dialog"
				aria-modal="true"
				aria-label="Menu"
			>
				<nav class="menu-orbs">
					<button
						id="type-size-toggle"
						type="button"
						data-size="medium"
						aria-label="Text size medium. Switch to small."
					>
						<span class="orb-glyph" aria-hidden="true">
							<span class="type-icon is-small">s</span>
							<span class="type-icon is-medium">s</span>
							<span class="type-icon is-big">S</span>
						</span>
						<span id="type-size-label">Medium</span>
					</button>
					<button
						id="appearance-toggle"
						type="button"
						aria-pressed="false"
						aria-label="Switch to dark appearance"
					>
						<span class="orb-glyph" aria-hidden="true">
							<span class="theme-icon is-sun">
								<svg viewBox="0 0 24 24" fill="none">
									<circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.5" />
									<path
										d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"
										stroke="currentColor"
										stroke-width="1.5"
										stroke-linecap="round"
									/>
								</svg>
							</span>
							<span class="theme-icon is-moon">
								<svg viewBox="0 0 24 24" fill="none">
									<path
										d="M15.4 13.6A6.4 6.4 0 0 1 10.2 5.4 6.9 6.9 0 1 0 18.6 14a6.4 6.4 0 0 1-3.2-.4z"
										stroke="currentColor"
										stroke-width="1.5"
										stroke-linejoin="round"
									/>
								</svg>
							</span>
						</span>
						<span>Appearance</span>
					</button>
					<button id="start-over" type="button">
						<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
							<path
								d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"
								stroke="currentColor"
								stroke-width="1.5"
								stroke-linecap="round"
							/>
							<path
								d="M4.5 5.5v4h4"
								stroke="currentColor"
								stroke-width="1.5"
								stroke-linecap="round"
								stroke-linejoin="round"
							/>
						</svg>
						<span>Start over</span>
					</button>
				</nav>
				<div class="menu-handle" id="menu-handle" aria-hidden="true"></div>
			</div>
		</div>

		<script type="module" src="/main.ts"></script>
	</body>
</html>
