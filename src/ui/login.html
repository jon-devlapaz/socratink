<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" id="theme-color" content="#fffcf0" />
		<script>
			(function () {
				var stored = null;
				try { stored = localStorage.getItem('%SOCRATINK_THEME_STORAGE_KEY%'); } catch {}
				var dark = stored === 'dark' ||
					(stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				if (stored === 'light' || stored === 'dark') document.documentElement.dataset.theme = stored;
				document.getElementById('theme-color').setAttribute('content', dark ? '#100f0f' : '#fffcf0');
			})();
		</script>
		<title>Sign in · Socratink</title>
		<link
			rel="icon"
			type="image/svg+xml"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23050505'/%3E%3C/svg%3E"
		/>
	</head>
	<body class="login-page">
		<div id="root"><!--page--></div>
		<script type="module" src="/login.tsx"></script>
	</body>
</html>
